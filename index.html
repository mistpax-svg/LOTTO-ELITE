<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lotto Elite - Premium Edition</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-color: #00f2fe;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1a1a2e, #0f0c29);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            color: white; overflow: hidden;
        }

        .app-container {
            width: 90%; max-width: 400px; height: 85vh;
            background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 44px;
            display: flex; flex-direction: column; padding: 35px 25px; box-sizing: border-box;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
        }

        .background-logo {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; height: 100%; opacity: 0.3; z-index: -1; pointer-events: none;
            object-fit: contain; filter: contrast(1.2) brightness(1.1) saturate(1.3);
        }

        header h1 {
            text-align: center; font-weight: 800; font-size: 1.8rem; letter-spacing: 5px; margin: 0 0 40px 0;
            background: linear-gradient(to right, #fff, var(--accent-color));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .number-display { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 50px; }

        .ball {
            width: 48px; height: 48px; background: rgba(255,255,255,0.05); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; color: #fff;
            font-weight: 800; font-size: 1.2rem; box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0);
        }

        .ball.show { transform: scale(1.1); }

        .history-section { flex-grow: 1; overflow: hidden; }
        .history-title {
            font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.6); margin-bottom: 15px;
            text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;
        }

        .log-item {
            background: rgba(0,0,0,0.4); padding: 15px 10px; border-radius: 18px; margin-bottom: 12px;
            display: flex; justify-content: space-around; animation: slideIn 0.4s ease-out forwards;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .log-num { font-weight: 900; font-size: 1.2rem; text-shadow: 0 0 10px rgba(0,0,0,0.5); }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .controls { display: flex; flex-direction: column; gap: 15px; align-items: flex-start; z-index: 10; }

        .generate-btn {
            width: 100%; background: var(--primary-gradient); border: none; padding: 22px;
            border-radius: 22px; color: white; font-size: 1.3rem; font-weight: 800;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 15px 35px rgba(118, 75, 162, 0.3);
        }

        .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .reset-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 18px; border-radius: 12px; color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
    </style>
</head>
<body>

<div class="app-container">
    <img src="lotto_logo.png" alt="Lotto Elite Logo" class="background-logo" onerror="this.style.display='none'">
    <header><h1>LOTTO ELITE</h1></header>
    <div class="number-display" id="ballContainer">
        <div class="ball">?</div><div class="ball">?</div><div class="ball">?</div>
        <div class="ball">?</div><div class="ball">?</div><div class="ball">?</div>
    </div>
    <div class="history-section">
        <div class="history-title">History Logs</div>
        <div id="logContainer"></div>
    </div>
    <div class="controls">
        <button class="reset-btn" onclick="resetApp()">초기화</button>
        <button class="generate-btn" id="genBtn" onclick="generateLotto()">로또번호 생성</button>
    </div>
</div>

<script>
    let logData = [];
    const gasUrl = https://script.google.com/macros/s/AKfycbxIXoeJMnUBZNH9cjSp4l8IeYq2blWeTv0xGgpxOdCPF6YWkNR0oFePz53FKap87lgFmQ/exec; // 중요!

    function getBallColor(num) {
        if (num <= 10) return '#fbc400';
        if (num <= 20) return '#69c8f2';
        if (num <= 30) return '#ff7272';
        if (num <= 40) return '#aaaaaa';
        return '#b0d840';
    }

    async function generateLotto() {
        if (window.navigator.vibrate) window.navigator.vibrate(15);
        const btn = document.getElementById('genBtn');
        btn.disabled = true;
        btn.textContent = "빅데이터 분석 중...";

        try {
            const response = await fetch(gasUrl);
            const data = await response.json();
            const numbers = data.numbers;

            const balls = document.querySelectorAll('.ball');
            balls.forEach((ball, index) => {
                ball.style.transform = 'scale(0)';
                setTimeout(() => {
                    ball.textContent = numbers[index];
                    const color = getBallColor(numbers[index]);
                    ball.style.backgroundColor = color;
                    ball.style.color = (numbers[index] <= 10) ? '#333' : '#fff';
                    ball.classList.add('show');
                    ball.style.transform = 'scale(1.1)';
                }, index * 100);
            });
            updateLog(numbers);
        } catch (e) {
            alert("서버 연결 실패! 랜덤 번호를 생성합니다.");
            generateFallback();
        } finally {
            btn.disabled = false;
            btn.textContent = "로또번호 생성";
        }
    }

    function generateFallback() {
        let nums = [];
        while(nums.length < 6) {
            let r = Math.floor(Math.random() * 45) + 1;
            if(!nums.includes(r)) nums.push(r);
        }
        nums.sort((a,b) => a-b);
        updateLog(nums);
    }

    function updateLog(nums) {
        const logContainer = document.getElementById('logContainer');
        logData.unshift(nums);
        if (logData.length > 5) logData.pop();
        logContainer.innerHTML = logData.map(entry => `
            <div class="log-item">
                ${entry.map(n => `<span class="log-num" style="color:${getBallColor(n)}">${n}</span>`).join('')}
            </div>
        `).join('');
    }

    function resetApp() {
        if(!confirm("기록을 초기화할까요?")) return;
        logData = [];
        document.getElementById('logContainer').innerHTML = '';
        const balls = document.querySelectorAll('.ball');
        balls.forEach(ball => {
            ball.textContent = '?'; ball.style.backgroundColor = 'rgba(255,255,255,0.05)';
            ball.style.color = '#fff'; ball.style.transform = 'scale(1)';
        });
    }
</script>
</body>
</html>
